<!doctype html>
<html lang="fr">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <!--seo-head-->
    <link rel="icon" href="/api/assets/neopolis-akademy-favicon_cffc00e5.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/api/assets/neopolis-akademy-icon-32_ba036d10.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/api/assets/neopolis-akademy-icon-180_a6e1a22c.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#174f9f" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="preload" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" /></noscript>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // RGPD: Ne charger analytics que si l'utilisateur a accepté les cookies
      (function() {
        var consent = localStorage.getItem('neopolis_cookie_consent');
        if (consent === 'accepted') {
          var s = document.createElement('script');
          s.defer = true;
          s.src = '%VITE_ANALYTICS_ENDPOINT%/umami';
          s.setAttribute('data-website-id', '%VITE_ANALYTICS_WEBSITE_ID%');
          document.body.appendChild(s);
        }
      })();
    </script>
  </body>

</html>
