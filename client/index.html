<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Neopolis Akademy</title>
    <link rel="icon" type="image/png" href="/manus-storage/favicon_neopolis_d1316b46.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // RGPD: Ne charger analytics que si l'utilisateur a accepté les cookies
      (function() {
        var consent = localStorage.getItem('neopolis_cookie_consent');
        if (consent === 'accepted') {
          var s = document.createElement('script');
          s.defer = true;
          s.src = '%VITE_ANALYTICS_ENDPOINT%/umami';
          s.setAttribute('data-website-id', '%VITE_ANALYTICS_WEBSITE_ID%');
          document.body.appendChild(s);
        }
      })();
    </script>
  </body>

</html>
